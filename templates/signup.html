<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up | E-Price Tracker</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #93c5fd);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: #ffffff;
            width: 380px;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            animation: fadeIn 0.4s ease;
        }

        h2 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #475569;
            margin-top: 0;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: 2px solid #93c5fd;
            border-radius: 10px;
            font-size: 14px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #2563eb;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: linear-gradient(90deg, #2563eb, #1e40af);
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37,99,235,0.4);
        }

        .link {
            margin-top: 15px;
            text-align: center;
        }

        .link a {
            color: #1e40af;
            font-weight: 600;
            text-decoration: none;
        }

        .msg {
            background: #dbeafe;
            border-left: 5px solid #2563eb;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            color: #1e3a8a;
        }

        @keyframes fadeIn {
            from { opacity:0; transform: translateY(10px); }
            to { opacity:1; transform: translateY(0); }
        }
    </style>
</head>

<body>

<div class="card">
    <h2>Create Account</h2>
    <p>Join E-Price Tracker to save more!</p>

    {% if message %}
    <div class="msg">{{ message }}</div>
    {% endif %}

    <form method="POST">

        <input type="text" name="username" placeholder="Choose Username" required>

        <input type="password" name="password" placeholder="Create Password" required>

        <button type="submit">Sign Up</button>

        <div class="link">
            Already have an account? <a href="/login">Login</a>
        </div>
    </form>
</div>

</body>
</html>
